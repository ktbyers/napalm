[mypy]
disallow_untyped_defs = False
allow_redefinition = True
plugins = pydantic.mypy

[mypy-napalm.base.*]
disallow_untyped_defs = True

[mypy-napalm.nxos.*]
# Aligned with the eos / ios / iosxr_netconf drivers above. The post-Pydantic
# migration the local-variable annotations (``foo: models.XDict = {}; foo[k] =
# ...``) trip mypy across the driver; the contract is enforced at runtime by
# NetworkDriver.__init_subclass__ wrapping each getter with _validate_return.
ignore_errors = True

[mypy-napalm.eos.*]
ignore_errors = True

[mypy-napalm.ios.*]
ignore_errors = True

[mypy-napalm.iosxr_netconf.*]
ignore_errors = True

[mypy-napalm.nxapi_plumbing.*]
disallow_untyped_defs = True

[mypy-napalm.base.clitools.*]
ignore_errors = True

[mypy-napalm.base.test.*]
ignore_errors = True

[mypy-netaddr.*]
ignore_missing_imports = True

[mypy-netmiko.*]
ignore_missing_imports = True

[mypy-jnpr.*]
ignore_missing_imports = True

[mypy-pyeapi.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-netutils.*]
ignore_missing_imports = True

[mypy-textfsm]
ignore_missing_imports = True

[mypy-ttp]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True
